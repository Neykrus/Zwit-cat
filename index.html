<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Vape Analytics: Fixed Revenue</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
        .btn { padding: 12px 24px; cursor: pointer; border: none; border-radius: 6px; color: white; background: #10b981; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        th, td { padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
<div class="container">
    <h1>Фінальний аналізатор</h1>
    <input type="file" id="file-input" multiple>
    <button id="calc-btn" class="btn">Розрахувати виторг</button>
    <div id="output"></div>
</div>

<script>
const GROUPS = {
    "Pod-системи": ["OXVA", "XLIM", "Elf Bar", "GeekVape", "Sonder", "LostVape", "SMOK", "Vaporesso", "Xros", "VooPoo", "Argus", "VINCI", "ZQ"],
    "Компоненти (Набори)": ["Набір", "Elfliq", "Chaser", "Octobar", "Punch", "Mix Bar", "FlavorLab", "Lucky", "Hype", "Phantom", "Blizz", "Alchemist"],
    "Ароматизатори": ["Аромат", "Wick&Wire", "InBottle", "420", "Chaser", "My Pods"],
    "Комплектуючі": ["Картридж", "Випарник", "RXELF"]
};

// Функция очистки строго для колонки 5 (Виторг) и 6 (Прибуток)
function clean(v) {
    if (!v) return 0;
    let s = v.toString().replace(/[^\d,.]/g, '').replace(',', '.');
    return parseFloat(s) || 0;
}

document.getElementById('calc-btn').onclick = () => {
    let files = document.getElementById('file-input').files;
    let totals = {};

    Array.from(files).forEach(file => {
        let reader = new FileReader();
        reader.onload = (e) => {
            let data = Papa.parse(e.target.result, {header:false}).data;
            
            data.forEach((row, idx) => {
                // Игнорируем заголовок и пустые строки
                if (idx < 2 || !row[1]) return;

                let itemName = row[1].toString();
                let revenue = clean(row[5]); // 5-й индекс - это Виторг (по вашему CSV)
                let profit = clean(row[6]);  // 6-й индекс - Прибуток

                let found = false;
                for (let group in GROUPS) {
                    if (GROUPS[group].some(k => itemName.includes(k))) {
                        if (!totals[group]) totals[group] = {r:0, p:0};
                        totals[group].r += revenue;
                        totals[group].p += profit;
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    if (!totals["Інші"]) totals["Інші"] = {r:0, p:0};
                    totals["Інші"].r += revenue;
                    totals["Інші"].p += profit;
                }
            });
            render(totals);
        };
        reader.readAsText(file);
    });
};

function render(totals) {
    let html = "<table><tr><th>Група</th><th>Виторг</th><th>Прибуток</th></tr>";
    for(let g in totals) {
        html += `<tr><td>${g}</td><td>${totals[g].r.toFixed(2)}</td><td>${totals[g].p.toFixed(2)}</td></tr>`;
    }
    document.getElementById('output').innerHTML = html + "</table>";
}
</script>
</body>
</html>
